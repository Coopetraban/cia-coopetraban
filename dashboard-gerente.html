<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIA — Dashboard Gerencial</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07121c;--bg2:#0b1a27;--panel:#0e2235;--card:#0f2438;
  --green:#00e676;--green2:#00c853;--teal:#1de9b6;
  --blue:#40c4ff;--amber:#ffab40;--red:#ff5252;
  --white:#f0f4f8;--gray:#6b8299;--lgray:#a8bfd0;
  --border:rgba(0,230,118,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--white);min-height:100vh}
body::before{content:"";position:fixed;inset:0;
  background:radial-gradient(ellipse 70% 50% at 85% 0%,rgba(0,230,118,.06) 0%,transparent 55%),
             radial-gradient(ellipse 50% 40% at 5% 95%,rgba(29,233,182,.04) 0%,transparent 55%);
  pointer-events:none;z-index:0}

/* HEADER */
header{position:sticky;top:0;z-index:100;
  background:rgba(7,18,28,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);padding:0 2rem}
.hdr{max-width:1100px;margin:0 auto;height:62px;
  display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:#0d2a1e;
  border:1px solid rgba(0,230,118,.2);overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:contain}
.brand-txt h1{font-family:"Syne",sans-serif;font-weight:800;font-size:.9rem;color:var(--white)}
.brand-txt p{font-size:.67rem;color:var(--gray)}
.hdr-right{display:flex;align-items:center;gap:10px}
.user-badge{display:flex;align-items:center;gap:7px;
  background:rgba(0,230,118,.07);border:1px solid rgba(0,230,118,.15);
  border-radius:20px;padding:5px 12px;font-size:.75rem;color:var(--green)}
.btn-logout{background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.2);
  color:var(--red);font-size:.75rem;font-weight:600;padding:6px 14px;
  border-radius:10px;cursor:pointer;transition:all .2s}
.btn-logout:hover{background:rgba(255,82,82,.15)}

/* MAIN */
main{max-width:1100px;margin:0 auto;padding:2rem 2rem 4rem;position:relative;z-index:1}

/* KPI ROW */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:1.8rem}
.kpi{background:var(--panel);border-radius:14px;padding:1rem 1.2rem;
  border:1px solid rgba(255,255,255,.05);text-align:center;transition:all .2s}
.kpi:hover{border-color:var(--border);transform:translateY(-2px)}
.kpi-num{font-family:"Syne",sans-serif;font-weight:900;font-size:2rem;line-height:1;margin-bottom:4px}
.kpi-label{font-size:.68rem;color:var(--gray);font-weight:500;text-transform:uppercase;letter-spacing:.8px}

/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:1.5rem;
  background:var(--bg2);border-radius:14px;padding:5px;
  border:1px solid rgba(255,255,255,.05);overflow-x:auto;width:fit-content}
.tab{padding:8px 16px;border-radius:10px;border:none;background:transparent;
  color:var(--gray);font-family:"Syne",sans-serif;font-weight:600;font-size:.78rem;
  cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--white)}
.tab.active{background:var(--panel);color:var(--green)}
.sec{display:none}.sec.active{display:block;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* MODULO CARD */
.modulo-grid{display:flex;flex-direction:column;gap:14px}
.modulo-card{background:var(--panel);border:1px solid rgba(255,255,255,.05);
  border-radius:16px;overflow:hidden;transition:all .2s}
.modulo-card:hover{border-color:var(--border);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.mc-header{padding:1rem 1.4rem;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05)}
.mc-title{display:flex;align-items:center;gap:10px}
.mc-icon{font-size:1.3rem}
.mc-name{font-family:"Syne",sans-serif;font-weight:700;font-size:.95rem;color:var(--white)}
.mc-area{font-size:.72rem;color:var(--gray);margin-top:2px}
.semaforo{display:flex;align-items:center;gap:8px}
.sem-dot{width:12px;height:12px;border-radius:50%}
.sem-label{font-size:.78rem;font-weight:600}
.mc-body{padding:1rem 1.4rem}
.mc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:.8rem}
.mc-stat{background:rgba(255,255,255,.03);border-radius:10px;padding:.7rem .9rem;text-align:center}
.mc-stat-num{font-family:"Syne",sans-serif;font-weight:800;font-size:1.3rem;line-height:1}
.mc-stat-lbl{font-size:.68rem;color:var(--gray);margin-top:3px}
.mc-meta{display:flex;align-items:center;justify-content:space-between;
  font-size:.75rem;color:var(--gray)}

/* EMPTY STATE */
.empty{text-align:center;padding:3rem;color:var(--gray)}
.empty-icon{font-size:2.5rem;margin-bottom:.8rem}
.empty p{font-size:.88rem}

/* LOADING */
.loading{text-align:center;padding:3rem;color:var(--gray);font-size:.88rem}
.spin{display:inline-block;animation:spin 1s linear infinite;font-size:1.5rem;margin-bottom:.8rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* REALTIME BADGE */
.realtime-badge{display:flex;align-items:center;gap:6px;
  background:rgba(29,233,182,.07);border:1px solid rgba(29,233,182,.15);
  border-radius:20px;padding:4px 10px;font-size:.7rem;color:var(--teal)}
.rt-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

@media(max-width:680px){
  .kpi-row{grid-template-columns:1fr 1fr}
  main{padding:1.2rem 1rem 3rem}
  .mc-stats{grid-template-columns:1fr 1fr}
}
</style>
</head>

<script type="module">
import { supabase } from './supabase-client.js';
import { requireAuth, logout } from './auth-guard.js';

// Verificar sesión — solo gerente y admin
const perfil = await requireAuth(['gerente','admin'], './index.html');
document.getElementById('user-badge').textContent = '👤 ' + perfil.nombre + ' · ' + perfil.rol;

window.cerrarSesion = () => logout('./index.html');

// ── Cargar todos los resultados ─────────────────────────────────────────────
async function cargarDatos() {
  const { data, error } = await supabase
    .from('resultados_cia')
    .select('*')
    .order('fecha', { ascending: false })
    .limit(500);

  if (error) { console.error(error); return; }

  renderTodos(data);
  renderKPIs(data);

  // Render por módulo
  const modulos = ['sarlaft','tasas','pila','cad','asesorias','tesoreria','abonos'];
  modulos.forEach(m => {
    const filtrado = data.filter(r => r.modulo === m);
    renderModulo(m, filtrado);
  });
}

function renderKPIs(data) {
  const hoy = new Date().toDateString();
  const hoy_data = data.filter(r => new Date(r.fecha).toDateString() === hoy);
  const alertas = data.reduce((sum,r) => sum + (r.resumen?.alertas_alta || 0), 0);
  const modulos_activos = [...new Set(data.map(r => r.modulo))].length;

  document.getElementById('kpi-total').textContent   = hoy_data.length;
  document.getElementById('kpi-ok').textContent      = data.filter(r=>r.estado==='completado').length;
  document.getElementById('kpi-pend').textContent    = data.filter(r=>r.estado!=='completado').length;
  document.getElementById('kpi-alertas').textContent = alertas;
  document.getElementById('kpi-modulos').textContent = modulos_activos;
}

const MODULOS_INFO = {
  sarlaft:   { icon:'🛡', nombre:'SARLAFT',              area:'Riesgos' },
  tasas:     { icon:'📊', nombre:'Informe de Tasas',      area:'Finanzas' },
  pila:      { icon:'👥', nombre:'Seguridad Social',      area:'Gestión Humana' },
  cad:       { icon:'📄', nombre:'CAD Comprobantes',      area:'Desarrollo' },
  asesorias: { icon:'💬', nombre:'Asesorías Virtuales',   area:'Crédito' },
  tesoreria: { icon:'🏦', nombre:'Cheques en Canje',      area:'Tesorería' },
  abonos:    { icon:'💰', nombre:'Abonos — Canje Cheques',area:'Abonos' },
};

function semaforo(data) {
  const sem = data[0]?.resumen?.semaforo || 'sin datos';
  const map = {
    'verde':    { color:'#00e676', label:'Sin alertas críticas' },
    'amarillo': { color:'#ffab40', label:'Alertas medias' },
    'rojo':     { color:'#ff5252', label:'Alertas críticas' },
    'sin datos':{ color:'#6b8299', label:'Sin ejecuciones' },
  };
  return map[sem] || map['sin datos'];
}

function renderCard(modulo, data) {
  const info = MODULOS_INFO[modulo] || { icon:'📦', nombre:modulo, area:'' };
  const sem  = semaforo(data);
  const ultimo = data[0];

  if (!ultimo) return `
    <div class="modulo-card">
      <div class="mc-header">
        <div class="mc-title">
          <span class="mc-icon">${info.icon}</span>
          <div><div class="mc-name">${info.nombre}</div>
          <div class="mc-area">${info.area}</div></div>
        </div>
        <div class="semaforo">
          <div class="sem-dot" style="background:#6b8299"></div>
          <span class="sem-label" style="color:#6b8299">Sin ejecuciones</span>
        </div>
      </div>
      <div class="empty"><div class="empty-icon">📭</div>
        <p>Este módulo aún no tiene resultados registrados.</p></div>
    </div>`;

  const r = ultimo.resumen || {};
  // Stats según módulo
  const isTes = modulo === 'tesoreria' || modulo === 'abonos';
  const statsHtml = isTes ? `
    <div class="mc-stat">
      <div class="mc-stat-num" style="color:var(--white)">${r.total_cheques || '—'}</div>
      <div class="mc-stat-lbl">Total cheques</div>
    </div>
    <div class="mc-stat">
      <div class="mc-stat-num" style="color:var(--teal)">$${r.total_valor ? Math.round(r.total_valor).toLocaleString('es-CO') : '—'}</div>
      <div class="mc-stat-lbl">Valor total</div>
    </div>
    <div class="mc-stat">
      <div class="mc-stat-num" style="color:var(--amber)">${r.por_vencer || '0'}</div>
      <div class="mc-stat-lbl">Por vencer</div>
    </div>
    <div class="mc-stat">
      <div class="mc-stat-num" style="color:var(--red)">${r.vencidos || '0'}</div>
      <div class="mc-stat-lbl">Vencidos</div>
    </div>` : `
    <div class="mc-stat">
      <div class="mc-stat-num" style="color:var(--white)">${r.total_clientes || r.total || '—'}</div>
      <div class="mc-stat-lbl">Total procesados</div>
    </div>
    <div class="mc-stat">
      <div class="mc-stat-num" style="color:var(--red)">${r.alertas_alta || '0'}</div>
      <div class="mc-stat-lbl">Alertas altas</div>
    </div>
    <div class="mc-stat">
      <div class="mc-stat-num" style="color:var(--amber)">${r.alertas_media || '0'}</div>
      <div class="mc-stat-lbl">Alertas medias</div>
    </div>
    <div class="mc-stat">
      <div class="mc-stat-num" style="color:var(--green)">${r.alertas_baja || '0'}</div>
      <div class="mc-stat-lbl">Alertas bajas</div>
    </div>`;

  return `
    <div class="modulo-card">
      <div class="mc-header">
        <div class="mc-title">
          <span class="mc-icon">${info.icon}</span>
          <div><div class="mc-name">${info.nombre}</div>
          <div class="mc-area">${info.area} · ${data.length} ejecución(es)</div></div>
        </div>
        <div class="semaforo">
          <div class="sem-dot" style="background:${sem.color}"></div>
          <span class="sem-label" style="color:${sem.color}">${sem.label}</span>
        </div>
      </div>
      <div class="mc-body">
        <div class="mc-stats">
          ${statsHtml}
        </div>
        <div class="mc-meta">
          <span>👤 ${ultimo.ejecutado_por}</span>
          <span>🕐 ${new Date(ultimo.fecha).toLocaleString('es-CO')}</span>
          <span style="color:${ultimo.estado==='completado'?'var(--green)':'var(--amber)'};font-weight:600">
            ${ultimo.estado==='completado'?'✓ Completado':'⏳ Pendiente'}
          </span>
        </div>
      </div>
    </div>`;
}

function renderTodos(data) {
  const modulos = ['sarlaft','tasas','pila','cad','asesorias','tesoreria','abonos'];
  const html = modulos.map(m => renderCard(m, data.filter(r=>r.modulo===m))).join('');
  document.getElementById('s-todos').innerHTML =
    `<div class="modulo-grid">${html}</div>`;
}

function renderModulo(m, data) {
  document.getElementById('s-'+m).innerHTML =
    `<div class="modulo-grid">${renderCard(m, data)}</div>`;
}

// TABS
window.switchTab = (id) => {
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  event.target.classList.add('active');
};

// REALTIME — actualiza automáticamente cuando llega un resultado nuevo
supabase.channel('resultados')
  .on('postgres_changes', { event:'INSERT', schema:'public', table:'resultados_cia' },
    () => cargarDatos())
  .subscribe();

// Carga inicial
await cargarDatos();
</script>
