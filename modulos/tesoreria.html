<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheques en Canje – Coopetraban</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script type="module">
import { supabase } from '../supabase-client.js';
import { requireAuth, logout } from '../auth-guard.js';

// ── Verificar sesión ──────────────────────────────────────────────────────
const perfil = await requireAuth(['usuario','admin'], '../index.html');

// Mostrar usuario en header
const userTag = document.getElementById('cia-user-tag');
if (userTag) userTag.textContent = '👤 ' + perfil.nombre;

// Botón cerrar sesión
document.getElementById('cia-logout')
  .addEventListener('click', () => logout('../index.html'));

// ── Guardar resultado en Supabase (solo metadatos) ────────────────────────
window.guardarResultadoCIA = async function({ total, total_valor, por_vencer, vencidos }) {
  try {
    const sem = vencidos > 10 ? 'rojo' : vencidos > 0 ? 'amarillo' : 'verde';
    await supabase.from('resultados_cia').insert({
      modulo:        'tesoreria',
      ejecutado_por: perfil.email,
      area:          perfil.area,
      resumen: {
        total_cheques: total,
        total_valor:   total_valor,
        por_vencer:    por_vencer,
        vencidos:      vencidos,
        semaforo:      sem,
      },
      estado: 'completado'
    });
    console.log('✅ Resultado guardado en CIA dashboard');
  } catch(e) {
    console.warn('⚠ CIA save error:', e.message);
  }
};
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Open+Sans:wght@300;400;600&display=swap');
:root {
  --green:      #007D4A;
  --green-dark: #005C35;
  --green-mid:  #009558;
  --gold:       #A67C2E;
  --white:      #FFFFFF;
  --offwhite:   #F8FAF9;
  --gray:       #8A9B93;
  --text:       #1A2E25;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Open Sans',sans-serif;
  background:var(--green-dark);
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:2rem;
  background-image:
    radial-gradient(ellipse at top left, rgba(0,149,88,0.3),transparent 55%),
    radial-gradient(ellipse at bottom right, rgba(0,40,20,0.5),transparent 60%);
}
.app { width:100%; max-width:600px; }
.header { text-align:center; margin-bottom:2.2rem; }
.logo-wrap {
  display:inline-flex; align-items:center; gap:12px;
  background:var(--white); border-radius:14px;
  padding:12px 24px; margin-bottom:1.4rem;
  box-shadow:0 8px 32px rgba(0,0,0,0.25);
}
.logo-name { font-family:'Montserrat',sans-serif; font-size:1.3rem; font-weight:900; color:var(--green); letter-spacing:.04em; line-height:1; }
.logo-sub  { font-size:.6rem; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--gray); margin-top:3px; }
h1 { font-family:'Montserrat',sans-serif; font-size:2rem; font-weight:900; color:var(--white); line-height:1.1; margin-bottom:.5rem; }
h1 span { color:var(--gold); }
.subtitle { font-size:.85rem; color:rgba(255,255,255,.5); }
.card { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:1.8rem; backdrop-filter:blur(16px); }
.drop-zone {
  border:2px dashed rgba(245,166,35,.5); border-radius:12px;
  padding:2.2rem 1.5rem; text-align:center; cursor:pointer; transition:all .2s;
}
.drop-zone:hover, .drop-zone.dragover { border-color:var(--gold); background:rgba(245,166,35,.06); }
.drop-icon { width:52px;height:52px; background:rgba(245,166,35,.15); border-radius:12px; display:flex;align-items:center;justify-content:center; margin:0 auto .9rem; }
.drop-icon svg { width:24px;height:24px; }
.drop-t { font-family:'Montserrat',sans-serif; font-size:.92rem; font-weight:700; color:var(--white); margin-bottom:.25rem; }
.drop-s { font-size:.76rem; color:rgba(255,255,255,.4); }
#fileInput { display:none; }
.fbadge { display:none; align-items:center; gap:10px; background:rgba(0,125,74,.2); border:1px solid rgba(0,125,74,.4); border-radius:10px; padding:.7rem 1rem; margin-top:1rem; }
.fbadge.show { display:flex; }
.ficon { width:32px;height:32px; background:var(--green); border-radius:7px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
.fname { font-size:.83rem; font-weight:600; color:var(--white); flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fcount { font-size:.73rem; color:#6EE7B7; white-space:nowrap; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:.7rem; margin-top:.9rem; }
.sc { background:rgba(0,125,74,.15); border:1px solid rgba(0,125,74,.25); border-radius:10px; padding:.7rem .4rem; text-align:center; display:none; }
.sc.show { display:block; }
.sv { font-family:'Montserrat',sans-serif; font-size:1.4rem; font-weight:900; color:var(--gold); line-height:1; margin-bottom:.22rem; }
.sl { font-size:.62rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.4); }
.btn {
  width:100%; margin-top:1.3rem; padding:.95rem;
  background:linear-gradient(135deg,var(--gold),#A67C2E);
  color:var(--green-dark); font-family:'Montserrat',sans-serif;
  font-size:.9rem; font-weight:800; letter-spacing:.04em;
  border:none; border-radius:12px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:.6rem;
  transition:all .2s; opacity:.35; pointer-events:none;
}
.btn.active { opacity:1; pointer-events:all; }
.btn:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(245,166,35,.35); }
.btn svg { width:18px;height:18px; }
.status { display:none; align-items:center; gap:.7rem; margin-top:.9rem; padding:.7rem 1rem; border-radius:10px; font-size:.82rem; font-weight:600; }
.status.info { display:flex; background:rgba(0,125,74,.15); border:1px solid rgba(0,125,74,.3); color:#6EE7B7; }
.status.ok   { display:flex; background:rgba(52,211,153,.1);  border:1px solid rgba(52,211,153,.3); color:#34D399; }
.status.err  { display:flex; background:rgba(220,38,38,.1);   border:1px solid rgba(220,38,38,.3);  color:#FCA5A5; }
.spin { width:15px;height:15px;border-radius:50%;border:2px solid rgba(110,231,183,.3);border-top-color:#6EE7B7;animation:sp .65s linear infinite;flex-shrink:0; }
@keyframes sp{to{transform:rotate(360deg)}}
.note { text-align:center; font-size:.7rem; color:rgba(255,255,255,.2); margin-top:1.1rem; line-height:1.7; }
</style>

document.getElementById('fileInput').addEventListener('change', e=>{if(e.target.files[0])loadFile(e.target.files[0]);});

let DATA=[];

function loadFile(file){
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      DATA=XLSX.utils.sheet_to_json(ws,{defval:''});
      document.getElementById('fn').textContent=file.name;
      let tv=0; const bks=new Set(),ags=new Set();
      DATA.forEach(row=>{
        tv+=numVal(row['Valor']);
        if(row['Banco']) bks.add(row['Banco']);
        if(row['Agencia']) ags.add(row['Agencia']);
      });
      document.getElementById('fc').textContent=DATA.length+' registros';
      document.getElementById('sT').textContent=DATA.length;
      document.getElementById('sV').textContent='$'+(tv).toLocaleString('es-CO',{maximumFractionDigits:0});
      const ents=new Set(); DATA.forEach(r=>{if(r['Entidad Compra'])ents.add(String(r['Entidad Compra']).trim().toUpperCase());}); document.getElementById('sB').textContent=ents.size;
      document.getElementById('fb').classList.add('show');
      ['s1','s2','s3'].forEach(id=>document.getElementById(id).classList.add('show'));
      document.getElementById('btn').classList.add('active');
      setSt('','');
    }catch(e){setSt('err','Error al leer: '+e.message);}
  };
  r.readAsArrayBuffer(file);
}

function setSt(t,m){
  const b=document.getElementById('sb');
  b.className='status';
  if(!t)return;
  b.classList.add(t);
  document.getElementById('sp').style.display=t==='info'?'block':'none';
  document.getElementById('sm').textContent=m;
}

// ── Utilidades ──────────────────────────────────────────
function numVal(v){return parseFloat(String(v||'').replace(/[\$,\s]/g,''))||0;}
function copFmt(v){const n=numVal(v);if(!n)return'–';return'$'+Math.round(n).toLocaleString('es-CO');}
function dateFmt(v){const m=String(v||'').match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:String(v||'').substring(0,10)||'–';}
function cntBy(arr,k){const m={};arr.forEach(r=>{const raw=String(r[k]||'').trim();if(!raw||raw==='N/A'||raw==='undefined'||raw==='null')return;m[raw]=(m[raw]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function sumBy(arr,gk,vk){const m={};arr.forEach(r=>{const key=String(r[gk]||'N/A').trim();m[key]=(m[key]||0)+numVal(r[vk]);});return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function normC(c){
  const s=String(c||'').trim().toUpperCase();
  if(s.includes('TASA')||s.includes('INTERES'))return'Mejor tasa';
  if(s.includes('CAPACIDAD')||s.includes('COLILLA'))return'Sin capacidad';
  if(s.includes('ENDEUDAMIENTO'))return'Alto endeudamiento';
  if(s.includes('RECURSO')||s.includes('PROPIO')||s.includes('RECOGE'))return'Recursos propios';
  if(s.includes('NEGAD')||s.includes('NEGAR'))return'Crédito negado';
  if(s.includes('CAPITAL'))return'Más capital';
  if(s.includes('MAYOR VALOR')||s.includes('OFRECIMIENTO'))return'Mayor oferta';
  if(!s)return'Otro';
  return s.length>22?s.substring(0,22)+'…':s;
}
function trunc(s,n){s=String(s||'');return s.length>n?s.substring(0,n)+'…':s;}
function agLabel(s){return String(s||'').replace(/^\d+-\s*/,'').trim();}

      s.addShape(pres.shapes.RECTANGLE,{x:.12,y:.14,w:3.0,h:.75,fill:{color:G.white},line:{color:G.white,width:0}});
      s.addImage({data:LOGO_IMG,x:.18,y:.16,w:2.88,h:.7});

      // Título principal
      s.addText('CHEQUES',{x:.22,y:1.3,w:5.9,h:.92,fontSize:66,fontFace:'Calibri',bold:true,color:G.white,charSpacing:4,margin:0});
      s.addText('EN CANJE',{x:.22,y:2.14,w:5.9,h:.85,fontSize:58,fontFace:'Calibri',bold:true,color:G.gold,charSpacing:4,margin:0});

      s.addShape(pres.shapes.RECTANGLE,{x:.22,y:3.14,w:5.0,h:.04,fill:{color:G.gold},line:{color:G.gold,width:0}});
      s.addText('Informe Ejecutivo',{x:.22,y:3.26,w:5.9,h:.32,fontSize:14,fontFace:'Calibri',color:G.white,italic:true,margin:0});

      const now=new Date();
      const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
      s.addText(`${now.getDate()} de ${meses[now.getMonth()]} de ${now.getFullYear()}`,{x:.22,y:3.66,w:5.9,h:.28,fontSize:10.5,fontFace:'Calibri',color:G.gold,bold:true,margin:0});

      // Panel derecho KPIs
      s.addText('DATOS CLAVE',{x:6.5,y:.35,w:3.1,h:.38,fontSize:9,fontFace:'Calibri',bold:true,color:G.gold,align:'center',charSpacing:4,margin:0});
      const kpis=[
        {v:String(DATA.length),l:'Cheques en Canje'},
        {v:copFmt(totalV),l:'Valor Total COP'},
        {v:String(entidades.size),l:'Entidades que Compran'},
        {v:String(agset.size),l:'Agencias Activas'},
      ];
      kpis.forEach((k,i)=>{
        const ky=.9+i*1.1;
        s.addShape(pres.shapes.RECTANGLE,{x:6.52,y:ky,w:3.08,h:.92,fill:{color:G.green},line:{color:G.white,width:0}});
        s.addShape(pres.shapes.RECTANGLE,{x:6.52,y:ky,w:.055,h:.92,fill:{color:G.gold},line:{color:G.gold,width:0}});
        s.addText(k.v,{x:6.68,y:ky+.06,w:2.8,h:.5,fontSize:26,fontFace:'Calibri',bold:true,color:G.white,margin:0});
        s.addText(k.l,{x:6.68,y:ky+.58,w:2.8,h:.26,fontSize:9,fontFace:'Calibri',color:G.gold,margin:0});
      });

      footer(s,1);
    }

    // ════ SLIDE 2 – KPI CARDS ════
    {
      const s=pres.addSlide();
      s.background={color:G.offwh};
      hdr(s,'INDICADORES GENERALES','Resumen consolidado del período analizado');

      const cards=[
        {v:String(DATA.length),l:'Total de Cheques',sub:'Registros procesados',c:G.green},
        {v:copFmt(totalV),l:'Valor Total COP',sub:'Suma de valores recibidos',c:G.gold},
        {v:String(entidades.size),l:'Entidades que Compran',sub:'Entidades externas',c:G.teal},
        {v:String(agset.size),l:'Agencias Activas',sub:'Puntos de atención',c:'5B8C5A'},
      ];
      cards.forEach((c,i)=>{
        const col=i%2,row=Math.floor(i/2);
        const cx=.28+col*4.98,cy=1.28+row*2.1;
        s.addShape(pres.shapes.RECTANGLE,{x:cx,y:cy,w:4.55,h:1.92,fill:{color:G.white},line:{color:'D1E8DC',width:.8}});
        s.addShape(pres.shapes.RECTANGLE,{x:cx,y:cy,w:.07,h:1.92,fill:{color:c.c},line:{color:c.c,width:0}});
        s.addShape(pres.shapes.OVAL,{x:cx+4.18,y:cy+.22,w:.22,h:.22,fill:{color:c.c},line:{color:c.c,width:0}});
        s.addText(c.v,{x:cx+.22,y:cy+.2,w:4.1,h:.72,fontSize:28,fontFace:'Calibri',bold:true,color:G.text,margin:0});
        s.addText(c.l,{x:cx+.22,y:cy+.92,w:4.1,h:.3,fontSize:12,fontFace:'Calibri',bold:true,color:G.text,margin:0});
        s.addText(c.sub,{x:cx+.22,y:cy+1.24,w:4.1,h:.24,fontSize:9,fontFace:'Calibri',color:G.slate,margin:0});
      });
      footer(s,2);
    }

    // ════ SLIDE 3 – ENTIDAD COMPRA, DESTINO & BANCO COOPERATIVA ════
    {
      const s=pres.addSlide();
      s.background={color:G.gDark};
      hdr(s,'DISTRIBUCIÓN POR ENTIDAD Y DESTINO','Entidad que compra el crédito · propósito del canje · banco de la cooperativa');

      // ── Normalizar nombres Entidad Compra (case-insensitive agrupado) ──
      const entMap = {};
      DATA.forEach(r => {
        const raw = String(r['Entidad Compra']||'').trim();
        const key = raw.toUpperCase()
          .replace(/BANCO\s+/,'')
          .replace(/\s+/,' ').trim();
        const display = raw.length ? raw.charAt(0).toUpperCase()+raw.slice(1).toLowerCase() : '–';
        // group by normalized key, keep first display name seen
        if (!entMap[key]) entMap[key] = {display, cnt:0};
        entMap[key].cnt++;
      });
      const byEnt = Object.values(entMap).sort((a,b)=>b.cnt-a.cnt);
      const entTotal = byEnt.reduce((a,b)=>a+b.cnt,0);

      // ── COLUMNA 1: Entidad que Compra (dinámica, todas) ──────────────────
      s.addText('ENTIDAD QUE COMPRA',{x:.18,y:1.18,w:3.3,h:.26,fontSize:8,fontFace:'Calibri',bold:true,color:G.gold,charSpacing:3,margin:0});

      // Calcular altura de fila dinámica para que quepan todas en el espacio disponible
      const maxRows = byEnt.length;
      const availH  = 3.9;   // espacio disponible en pulgadas
      const rowH    = Math.min(0.52, availH / Math.max(maxRows, 1));
      const fontSize= rowH < 0.38 ? 7 : 8;
      const barH    = rowH < 0.38 ? 0.11 : 0.14;
      const eCols   = [G.gold,G.teal,G.gMid,'F97316','8B5CF6','10B981','FB7185','A0C878',
                       'FF6B6B','4FC3F7','FFD54F','81C784','CE93D8','FFAB40','4DD0E1','F48FB1','B0BEC5'];

      byEnt.forEach(({display, cnt}, i) => {
        const pct = cnt / entTotal;
        const by  = 1.52 + i * rowH;
        const col = eCols[i % eCols.length];
        const bw  = 2.55 * pct;
        const lbl = display.length > 16 ? display.substring(0,16)+'…' : display;

        s.addShape(pres.shapes.RECTANGLE,{x:.18,y:by+.03,w:.12,h:.12,fill:{color:col},line:{color:col,width:0}});
        s.addText(lbl,{x:.34,y:by,w:1.9,h:rowH*.55,fontSize,fontFace:'Calibri',color:G.white,valign:'middle',margin:0});
        s.addShape(pres.shapes.RECTANGLE,{x:.18,y:by+rowH*.55,w:2.55,h:barH,fill:{color:G.green},line:{color:G.green,width:0}});
        if(bw>0) s.addShape(pres.shapes.RECTANGLE,{x:.18,y:by+rowH*.55,w:bw,h:barH,fill:{color:col},line:{color:col,width:0}});
        s.addText(`${cnt} (${(pct*100).toFixed(0)}%)`,{x:2.76,y:by,w:.88,h:rowH*.55,fontSize:fontSize-1,fontFace:'Calibri',color:G.goldLt,bold:true,align:'right',valign:'middle',margin:0});
      });

      // Separador 1|2
      s.addShape(pres.shapes.RECTANGLE,{x:3.72,y:1.12,w:.025,h:4.1,fill:{color:G.green},line:{color:G.green,width:0}});

      // ── COLUMNA 2: Por Destino ────────────────────────────────────────────
      const dCols=[G.gold,G.teal,G.gMid,'F97316','8B5CF6','10B981'];
      s.addText('POR DESTINO',{x:3.85,y:1.18,w:3.0,h:.26,fontSize:8,fontFace:'Calibri',bold:true,color:G.gold,charSpacing:3,margin:0});
      byDst.slice(0,6).forEach(([dest,cnt],i)=>{
        const pct=cnt/DATA.length;
        const by=1.52+i*.62;
        const col=dCols[i%dCols.length];
        s.addShape(pres.shapes.RECTANGLE,{x:3.85,y:by+.04,w:.14,h:.14,fill:{color:col},line:{color:col,width:0}});
        s.addText(trunc(dest,20),{x:4.04,y:by,w:2.1,h:.26,fontSize:8.5,fontFace:'Calibri',color:G.white,margin:0});
        s.addText(String(cnt),{x:6.58,y:by,w:.48,h:.28,fontSize:14,fontFace:'Calibri',bold:true,color:col,align:'right',margin:0});
        s.addText(`${(pct*100).toFixed(0)}% del total`,{x:4.04,y:by+.27,w:1.5,h:.19,fontSize:7,fontFace:'Calibri',color:G.muted,margin:0});
        s.addShape(pres.shapes.RECTANGLE,{x:3.85,y:by+.5,w:3.22,h:.014,fill:{color:G.green},line:{color:G.green,width:0}});
      });

      // Separador 2|3
      s.addShape(pres.shapes.RECTANGLE,{x:7.1,y:1.12,w:.025,h:4.1,fill:{color:G.green},line:{color:G.green,width:0}});

      // ── COLUMNA 3: Banco Cooperativa ──────────────────────────────────────
      const byBcoLocal = cntBy(DATA,'Banco');
      s.addText('BANCO COOPERATIVA',{x:7.2,y:1.18,w:2.6,h:.26,fontSize:8,fontFace:'Calibri',bold:true,color:G.gold,charSpacing:3,margin:0});

      // Header tabla
      s.addShape(pres.shapes.RECTANGLE,{x:7.2,y:1.5,w:2.62,h:.28,fill:{color:G.green},line:{color:G.green,width:0}});
      s.addText('Banco',{x:7.24,y:1.5,w:1.72,h:.28,fontSize:7.5,fontFace:'Calibri',bold:true,color:G.gold,valign:'middle',margin:0});
      s.addText('Cant.',{x:9.0,y:1.5,w:.76,h:.28,fontSize:7.5,fontFace:'Calibri',bold:true,color:G.gold,align:'right',valign:'middle',margin:0});

      byBcoLocal.forEach(([banco,cnt],i)=>{
        const ry=1.8+i*.44;
        const bg=i%2===0?G.green:G.gDark;
        const col=eCols[i%eCols.length];
        const blbl=banco.length>18?banco.substring(0,18)+'…':banco;
        s.addShape(pres.shapes.RECTANGLE,{x:7.2,y:ry,w:2.62,h:.4,fill:{color:bg},line:{color:bg,width:0}});
        s.addShape(pres.shapes.RECTANGLE,{x:7.2,y:ry,w:.04,h:.4,fill:{color:col},line:{color:col,width:0}});
        s.addText(blbl,{x:7.28,y:ry+.04,w:1.6,h:.32,fontSize:8.5,fontFace:'Calibri',color:G.white,valign:'middle',margin:0});
        s.addText(String(cnt),{x:9.0,y:ry+.04,w:.76,h:.32,fontSize:10,fontFace:'Calibri',bold:true,color:col,align:'right',valign:'middle',margin:0});
      });

      footer(s,3);
    }

    // ════ SLIDE 4 – TOP AGENCIAS ════
    {
      const s=pres.addSlide();
      s.background={color:G.offwh};
      hdr(s,'TOP AGENCIAS POR VALOR','Agencias con mayor volumen de cheques canjeados (COP)');

      const maxV2=byAg[0]?byAg[0][1]:1;
      byAg.slice(0,8).forEach(([ag,val],i)=>{
        const cnt2=DATA.filter(r=>r['Agencia']===ag).length;
        const pct=val/maxV2;
        const bw=5.4*pct;
        const by=1.22+i*.535;
        const isTop=i===0;
        const bc=isTop?G.gold:i<3?G.green:G.gMid;

        s.addShape(pres.shapes.RECTANGLE,{x:.2,y:by,w:.36,h:.33,fill:{color:isTop?G.gold:G.green},line:{color:isTop?G.gold:G.green,width:0}});
        s.addText(String(i+1),{x:.2,y:by,w:.36,h:.33,fontSize:isTop?12:10,fontFace:'Calibri',bold:true,color:G.white,align:'center',valign:'middle',margin:0});
        s.addText(agLabel(ag),{x:.62,y:by,w:2.5,h:.33,fontSize:isTop?10.5:9.5,fontFace:'Calibri',bold:isTop,color:G.text,valign:'middle',margin:0});

        s.addShape(pres.shapes.RECTANGLE,{x:3.22,y:by+.07,w:5.4,h:.19,fill:{color:G.grayLt},line:{color:G.grayLt,width:0}});
        if(bw>0) s.addShape(pres.shapes.RECTANGLE,{x:3.22,y:by+.07,w:bw,h:.19,fill:{color:bc},line:{color:bc,width:0}});
        s.addText(copFmt(val),{x:3.28+bw+.04,y:by,w:2.4,h:.33,fontSize:isTop?9.5:8.5,fontFace:'Calibri',bold:isTop,color:'4B5563',valign:'middle',margin:0});
        s.addText(`${cnt2} ch.`,{x:.62,y:by+.3,w:.9,h:.18,fontSize:7.5,fontFace:'Calibri',color:G.gray,margin:0});
      });

      footer(s,4);
    }

    // ════ SLIDE 5 – CAUSALES ════
    {
      const s=pres.addSlide();
      s.background={color:G.gDark};
      hdr(s,'CAUSALES DE CANJE','Principales motivos por los cuales los cheques fueron canjeados');

      // ── Normalizar y agrupar causales ──────────────────────────────────────
      // Solo registros CON causal diligenciada
      const causalMap={};
      let sinCausal=0;
      DATA.forEach(r=>{
        const raw=String(r['Causal Compra']||'').trim();
        if(!raw || raw==='undefined' || raw==='null'){
          sinCausal++;
          return; // excluir vacíos del conteo porcentual
        }
        const k=normC(raw);
        causalMap[k]=(causalMap[k]||0)+1;
      });
      // Total CON causal → base del 100%
      const causalBase = DATA.length - sinCausal;
      const byCslFixed = Object.entries(causalMap).sort((a,b)=>b[1]-a[1]).slice(0,8);

      const cCols=[G.gold,G.teal,G.gMid,G.goldLt,'F97316','8B5CF6','10B981','FB7185'];

      byCslFixed.forEach(([causal,cnt],i)=>{
        // Porcentaje sobre registros CON causal (suma = 100%)
        const pct = causalBase > 0 ? (cnt/causalBase*100) : 0;
        const col=i%4, row=Math.floor(i/4);
        const cx=.22+col*2.42, cy=1.28+row*2.06;
        const cc=cCols[i%cCols.length];
        const cw=2.24, ch=1.84;

        s.addShape(pres.shapes.RECTANGLE,{x:cx,y:cy,w:cw,h:ch,fill:{color:G.green},line:{color:G.green,width:0}});
        s.addShape(pres.shapes.RECTANGLE,{x:cx,y:cy,w:cw,h:.06,fill:{color:cc},line:{color:cc,width:0}});
        s.addText(`${pct.toFixed(0)}%`,{x:cx+.08,y:cy+.1,w:cw-.14,h:.74,fontSize:36,fontFace:'Calibri',bold:true,color:cc,align:'center',margin:0});
        s.addText(causal,{x:cx+.08,y:cy+.86,w:cw-.14,h:.55,fontSize:8.5,fontFace:'Calibri',color:G.white,align:'center',margin:0});
        s.addText(`${cnt} caso${cnt>1?'s':''}`,{x:cx+.08,y:cy+1.44,w:cw-.14,h:.28,fontSize:8,fontFace:'Calibri',color:G.muted,align:'center',margin:0});
      });

      // Nota de registros sin causal (si los hay)
      if(sinCausal > 0){
        s.addShape(pres.shapes.RECTANGLE,{x:.22,y:5.08,w:9.56,h:.2,fill:{color:G.green},line:{color:G.green,width:0}});
        s.addText(`* Porcentajes calculados sobre ${causalBase} registros con causal diligenciada. ${sinCausal} registros sin causal no se incluyen.`,
          {x:.3,y:5.08,w:9.4,h:.2,fontSize:7,fontFace:'Calibri',color:G.muted,italic:true,margin:0});
      }

      footer(s,5);
    }


        // ════ SLIDE FINAL – GRÁFICA DONA ════
    {
      const s = pres.addSlide();
      s.background = { color: G.offwh };

      // Header
      s.addShape(pres.shapes.RECTANGLE,{x:0,y:0,w:10,h:1.08,fill:{color:G.green},line:{color:G.green,width:0}});
      stripe(s, G.gold);
      s.addText('RESUMEN EJECUTIVO',{x:.24,y:.13,w:9,h:.46,fontSize:20,fontFace:'Calibri',bold:true,color:G.white,margin:0});
      s.addText('Distribución por destino · volumen y valor de cheques canjeados',{x:.24,y:.62,w:9,h:.28,fontSize:9.5,fontFace:'Calibri',color:G.muted,margin:0});

      // ── Donut chart (PPTX nativo) – distribución por destino ──
      const donutData = byDst.slice(0,5);
      const chartData = [{
        name: 'Cheques',
        labels: donutData.map(d => d[0]),
        values: donutData.map(d => d[1]),
      }];

      s.addChart(pres.charts.DOUGHNUT, chartData, {
        x: 0.25, y: 1.15, w: 4.7, h: 4.1,
        holeSize: 55,
        showLabel: false,
        showValue: true,
        showPercent: false,
        showLegend: true,
        legendPos: 'b',
        legendFontSize: 9,
        legendColor: G.text,
        chartColors: [G.green, G.gold, G.teal, G.gMid, '4CAF81'],
        chartArea: { fill: { color: G.offwh } },
        dataNoEffects: true,
        showTitle: false,
        dataLabelFontSize: 10,
        dataLabelColor: G.white,
      });

      // Centro de la dona — texto superpuesto
      s.addText(String(DATA.length),{x:.7,y:2.52,w:3.7,h:.58,fontSize:30,fontFace:'Calibri',bold:true,color:G.green,align:'center',margin:0});
      s.addText('cheques',{x:.7,y:3.04,w:3.7,h:.26,fontSize:9,fontFace:'Calibri',color:G.slate,align:'center',margin:0});

      // ── Panel derecho ──
      // KPIs principales
      const kpis2=[
        {v:copFmt(totalV), l:'Valor Total', c:G.green},
        {v:String(DATA.length), l:'Total Cheques', c:G.gold},
      ];
      kpis2.forEach((k,i)=>{
        const kx=5.2+i*2.36;
        s.addShape(pres.shapes.RECTANGLE,{x:kx,y:1.2,w:2.2,h:1.02,fill:{color:G.white},line:{color:'D1E8DC',width:.8}});
        s.addShape(pres.shapes.RECTANGLE,{x:kx,y:1.2,w:.06,h:1.02,fill:{color:k.c},line:{color:k.c,width:0}});
        s.addText(k.v,{x:kx+.16,y:1.28,w:1.95,h:.46,fontSize:16,fontFace:'Calibri',bold:true,color:G.text,margin:0});
        s.addText(k.l,{x:kx+.16,y:1.76,w:1.95,h:.28,fontSize:8.5,fontFace:'Calibri',color:G.slate,margin:0});
      });

      // Barras de destino
      s.addText('DISTRIBUCIÓN POR DESTINO',{x:5.1,y:2.42,w:4.7,h:.26,fontSize:7.5,fontFace:'Calibri',bold:true,color:G.green,charSpacing:2,margin:0});
      const segCols=['#'+G.green,'#'+G.gold,'#'+G.teal,'#'+G.gMid,'#4CAF81'];
      const segPptx=[G.green, G.gold, G.teal, G.gMid, '4CAF81'];
      byDst.slice(0,5).forEach(([dest,cnt],i)=>{
        const pct=cnt/DATA.length;
        const by=2.78+i*.5;
        const bw=3.5*pct;
        const col=segPptx[i%segPptx.length];
        const lbl=dest.length>22?dest.substring(0,22)+'…':dest;
        s.addText(lbl,{x:5.1,y:by,w:2.4,h:.26,fontSize:8.5,fontFace:'Calibri',color:G.text,margin:0});
        s.addShape(pres.shapes.RECTANGLE,{x:5.1,y:by+.27,w:3.55,h:.15,fill:{color:G.grayLt},line:{color:G.grayLt,width:0}});
        if(bw>0) s.addShape(pres.shapes.RECTANGLE,{x:5.1,y:by+.27,w:bw,h:.15,fill:{color:col},line:{color:col,width:0}});
        s.addText(`${cnt}  (${(pct*100).toFixed(0)}%)`,{x:8.68,y:by,w:.95,h:.26,fontSize:8,fontFace:'Calibri',color:col,bold:true,align:'right',margin:0});
      });

      // Pie de slide con marca
      s.addText('coopetraban · ahorro y crédito',{x:.22,y:5.05,w:4,h:.22,fontSize:8,fontFace:'Calibri',color:G.green,italic:true,margin:0});
      footer(s, 6);
    }

        // ── Guardar ──
    setSt('info','Guardando archivo…');
    await pres.writeFile({fileName:'CanjeCheques_Coopetraban.pptx'});
    setSt('ok','✅ ¡Presentación generada! El archivo se descargó automáticamente.');

    // ── CIA: guardar resumen en Supabase (sin datos sensibles) ────────────
    if (typeof window.guardarResultadoCIA === 'function') {
      // Calcular totales desde DATA
      let tv = 0, porVencer = 0, vencidos = 0;
      const hoy = new Date();
      DATA.forEach(r => {
        tv += parseFloat(String(r['Valor'] || r['VALOR'] || r['valor'] || 0)
              .replace(/[^0-9.]/g,'')) || 0;
        const fv = r['Fecha Vencimiento'] || r['FECHA VENCIMIENTO'] ||
                   r['FechaVencimiento'] || '';
        if (fv) {
          const d = new Date(fv);
          if (!isNaN(d)) {
            const dias = Math.ceil((d - hoy) / 86400000);
            if (dias < 0) vencidos++;
            else if (dias <= 5) porVencer++;
          }
        }
      });
      window.guardarResultadoCIA({
        total:       DATA.length,
        total_valor: Math.round(tv),
        por_vencer:  porVencer,
        vencidos:    vencidos,
      });
    }
    document.getElementById('btn').classList.add('active');

  }catch(err){
    console.error(err);
    setSt('err','Error: '+err.message);
    document.getElementById('btn').classList.add('active');
  }
}
</script>
